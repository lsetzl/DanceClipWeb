<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DanceClip — Export diagnostics</title>
  <style>
    :root { color-scheme: dark; }
    body { font: 15px system-ui, sans-serif; background: #1b1d22; color: #e6e6e6; margin: 0; padding: 16px; max-width: 760px; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    *, *::before, *::after { box-sizing: border-box; }
    fieldset { border: 1px solid #444; border-radius: 6px; margin: 0 0 12px; min-width: 0; }
    label { display: block; margin: 6px 0; }
    input[type=number] { width: 90px; }
    input[type=file] { max-width: 100%; }
    textarea { width: 100%; height: 90px; background: #111; color: #ddd; box-sizing: border-box; }
    button { font-size: 16px; padding: 8px 16px; }
    progress { width: 100%; height: 18px; margin: 8px 0; }
    pre { background: #111; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
    .muted { color: #999; font-size: 13px; }
  </style>
</head>
<body>
  <div class="top">
    <h1 data-i18n="poc.title"></h1>
    <select id="lang"><option value="ja">日本語</option><option value="en">English</option></select>
  </div>
  <p class="muted" data-i18n="poc.lead"></p>
  <fieldset>
    <legend data-i18n="poc.files"></legend>
    <label><span data-i18n="poc.video"></span> <input id="video" type="file" accept="video/*"></label>
    <label><span data-i18n="poc.audio"></span> <input id="audio" type="file" accept="audio/*,.m4a,.mp3"></label>
  </fieldset>
  <fieldset>
    <legend data-i18n="poc.settings"></legend>
    <label><span data-i18n="poc.length"></span> <input id="len" type="number" value="30" min="1" step="1"></label>
    <label><span data-i18n="poc.bitrate"></span> <input id="vbr" type="number" value="14" step="1"></label>
    <details>
      <summary data-i18n="poc.advanced"></summary>
      <p class="muted" data-i18n="poc.jsonHelp"></p>
      <textarea id="json" placeholder='{"video_ref_ms":40850,"audio_ref_ms":53500,"trim":{"start_ms":40000,"end_ms":86000},"fade":{"in_ms":1000,"out_ms":1000},"rotation":null}'></textarea>
    </details>
  </fieldset>
  <fieldset>
    <legend data-i18n="poc.diag"></legend>
    <button id="diag" data-i18n="poc.diagRun"></button>
  </fieldset>
  <button id="run" data-i18n="poc.run"></button>
  <button id="cancel" disabled data-i18n="poc.cancel"></button>
  <progress id="prog" max="1" value="0"></progress>
  <pre id="log"></pre>
  <p class="muted"><a href="https://github.com/lsetzl/DanceClipWeb" style="color:#9ab">GitHub</a> · MIT · <a href="./">App</a> · <a href="THIRD_PARTY_LICENSES.txt" style="color:#9ab">Third-party licenses</a></p>
  <script type="module" src="/src/poc.ts"></script>
</body>
</html>
